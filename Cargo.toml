[package]
name = "ledgerly"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6"
actix-web = "4"
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = "3"
futures-util = "0.3"
chrono = { version = "0.4", features = ["clock"] }
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
